server {
    listen 80;
    # also on 8080, for ECS port mappings / health checks set to the backend's port
    listen 8080;
    server_name localhost;

    # Resolve the backend host at request time (not at startup)
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream "${BACKEND_URL}";

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # GOOGLE MAPS
    # /api/google-maps/place/...  ->  https://maps.googleapis.com/maps/api/place/...
    location /api/google-maps/ {
        proxy_pass https://maps.googleapis.com/maps/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host maps.googleapis.com;
    }

    # DENTYPRO
    location /api/dentypro/ {

        rewrite ^/api/dentypro/(.*)$ /$1 break;

        proxy_pass http://qa-92rf.dentypro.com;

        proxy_http_version 1.1;

        proxy_set_header Host qa-92rf.dentypro.com;
    }

    # IMPORT XLSX
    location /api/import-xlsx/ {

        rewrite ^/api/import-xlsx/(.*)$ /api/user-products/import-xlsx/$1 break;

        proxy_pass $backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
    }

    # DEFAULT API
    location /api/ {

        proxy_pass $backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
